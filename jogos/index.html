<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jogos — Gustavo Ripka</title>
<link rel="stylesheet" href="jogos.css">
<style>
  .apphub { max-width: 1000px; }
  .apphub header { text-align: center; margin-bottom: clamp(20px, 4vw, 36px); position: relative; }
  .theme-btn {
    position: absolute; right: 0; top: 0;
    display: inline-flex; align-items: center; justify-content: center;
    width: 40px; height: 40px; border-radius: 12px;
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    cursor: pointer; transition: border-color .15s, background .15s;
  }
  .theme-btn:hover { border-color: var(--acc); background: var(--acc-soft); }
  .apphub h1 { font-size: clamp(28px, 6vw, 44px); font-weight: 800; letter-spacing: -.02em; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .apphub h1 svg { color: var(--acc); }
  .apphub h1 span { color: var(--acc); }
  .apphub header p { color: var(--text-soft); margin-top: 8px; font-size: 15px; }
  nav { display: flex; justify-content: center; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
  nav a {
    color: var(--text-soft); text-decoration: none; font-size: 13px; font-weight: 600;
    padding: 6px 12px; border: 1px solid var(--border); border-radius: 999px; transition: all .15s;
  }
  nav a:hover { color: var(--acc); border-color: var(--acc); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: 22px; display: flex; flex-direction: column; gap: 12px; position: relative;
    transition: transform .15s, border-color .15s, box-shadow .15s;
    text-decoration: none; color: inherit;
  }
  .card:hover { transform: translateY(-4px); border-color: var(--acc); box-shadow: var(--shadow); text-decoration: none; }
  .card .icon {
    width: 56px; height: 56px; border-radius: 14px; display: flex; align-items: center; justify-content: center;
    background: var(--surface-2); border: 1px solid var(--border);
  }
  .card .icon svg { color: var(--acc); }
  .card h2 { font-size: 20px; font-weight: 700; }
  .card p { color: var(--text-soft); font-size: 14px; line-height: 1.5; flex: 1; }
  .card .tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { font-size: 11px; color: var(--text-soft); background: var(--surface-2); border: 1px solid var(--border); padding: 3px 8px; border-radius: 999px; font-weight: 600; }
  .play {
    margin-top: 6px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    background: linear-gradient(135deg, var(--acc), var(--acc-strong)); color: #fff; text-decoration: none; font-weight: 600; font-size: 15px;
    padding: 11px; border-radius: 12px; transition: filter .12s;
  }
  .play:hover { filter: brightness(1.12); text-decoration: none; }
  .play.done { background: var(--good); }
  .badge { position: absolute; top: 18px; right: 18px; font-size: 11px; color: var(--text); background: var(--good); padding: 3px 9px; border-radius: 999px; font-weight: 700; }
  .soon { opacity: .55; pointer-events: none; }
  .soon .play { background: var(--surface-2); color: var(--text-soft); }
  footer { text-align: center; color: var(--text-soft); font-size: 13px; margin-top: 36px; }
  footer a { color: var(--acc); text-decoration: none; }
  @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap apphub">
  <header>
    <button class="theme-btn" id="themeBtn" type="button" aria-label="Alternar tema"><svg id="themeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
    <h1><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="14" height="10" rx="2"/><path d="M5 8V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-2"/><path d="M8 13h2m3 0h2"/></svg> <span>Jogos</span></h1>
    <p>Coleção de joguinhos clássicos — escolha e jogue.</p>
    <nav>
      <a href="#ligue4">Ligue 4</a>
      <a href="#xadrez">Xadrez</a>
      <a href="#dama">Dama</a>
      <a href="#truco">Truco</a>
      <a href="#paciencia">Paciência</a>
      <a href="#slide">Slide</a>
    </nav>
  </header>

  <div class="grid" id="grid"></div>

  <footer>Feito por Gustavo Ripka — mais jogos em breve · <a href="../index.html">← Portfólio</a></footer>
</div>

<script src="jogos.js"></script>
<script>
const ICONS = {
  ligue4: '<circle cx="12" cy="12" r="9"/>',
  xadrez: '<circle cx="7" cy="7" r="2.5"/><circle cx="17" cy="7" r="2.5"/><circle cx="12" cy="13" r="2.5"/><path d="M12 3v2m-4 1l-3 5 3 1 4-4m4 3l3 5-3 1-4-4"/>',
  dama: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/>',
  truco: '<rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18"/><path d="M7 6l-2-3m5 3l-2-3m5 3l-2-3m5 3l-2-3"/>',
  paciencia: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4m8-4v4"/><path d="M7 12h10M7 16h10"/>',
  slide: '<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h6V4M14 14h6v6"/>'
};
const GAMES = [
  { id: 'ligue4', title: 'Ligue 4', desc: 'Conecte 4 discos da mesma cor na vertical, horizontal ou diagonal antes do adversário. Jogo de estratégia para 2 jogadores.', tags: ['2 jogadores', 'Estratégia'], href: 'ligue4.html', done: true, accent: 'red' },
  { id: 'xadrez', title: 'Xadrez', desc: 'O clássico jogo de estratégia. Capture o rei adversário com movimentos clássicos de todas as peças. Para 2 jogadores.', tags: ['2 jogadores', 'Estratégia'], href: 'xadrez.html', done: true, accent: 'purple' },
  { id: 'dama', title: 'Dama', desc: 'Movimente e capture peças adversárias em diagonal. Promova suas peças a damas e domine o tabuleiro. Para 2 jogadores.', tags: ['2 jogadores', 'Tabuleiro'], href: 'dama.html', done: true, accent: 'green' },
  { id: 'truco', title: 'Truco', desc: 'O tradicional jogo de cartas brasileiro com manilhas, blefes e pedidos de truco. Vença as 3 mãos contra o computador.', tags: ['1 jogador', 'Cartas'], href: 'truco.html', done: true, accent: 'gold' },
  { id: 'paciencia', title: 'Paciência', desc: 'O clássico solitaire Klondike. Empilhe as cartas em ordem e organize as fundações do Ás ao Rei. Jogador único.', tags: ['1 jogador', 'Cartas'], href: 'paciencia.html', done: true, accent: 'cyan' },
  { id: 'slide', title: 'Slide Puzzle', desc: 'Quebra-cabeça deslizante 3x3. Organize os blocos numerados em ordem com o menor número de movimentos e tempo.', tags: ['1 jogador', 'Lógica'], href: 'slide.html', done: true, accent: 'blue' },
];

const grid = document.getElementById('grid');
GAMES.forEach(g => {
  const card = document.createElement('a');
  card.className = 'card' + (g.done ? '' : ' soon');
  card.id = g.id;
  card.href = g.href || '#';
  card.setAttribute('data-accent', g.accent);
  const badge = g.done ? '<span class="badge">Jogar</span>' : '<span class="badge" style="background:var(--surface-2);color:var(--text-soft)">Em breve</span>';
  card.innerHTML = `
    ${badge}
    <div class="icon"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[g.id]}</svg></div>
    <h2>${g.title}</h2>
    <p>${g.desc}</p>
    <div class="tags">${g.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
    <span class="play ${g.done ? 'done' : ''}">${g.done ? 'Jogar' : 'Em breve'}</span>
  `;
  grid.appendChild(card);
});

document.querySelectorAll('.card[data-accent]').forEach(card => {
  card.addEventListener('mouseenter', () => {
    const a = card.dataset.accent;
    if (a) document.documentElement.setAttribute('data-accent', a);
  });
  card.addEventListener('mouseleave', () => {
    document.documentElement.removeAttribute('data-accent');
  });
});
</script>
</body>
</html>
