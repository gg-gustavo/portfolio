<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark" data-accent="gold">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preview Layout Dupla — Truco</title>
<style>
  :root{
    --bg:#0f1113; --panel:#171a1f; --panel2:#1f2329;
    --text:#f1f5f4; --muted:#9aa4a1; --accent:#fbbf24;
    --border:#262b2f;
    --red:#ff6b6b; --gold:#f5a623; --green:#2ed573; --radius:16px;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:radial-gradient(1200px 800px at 50% -10%,#1e2a45 0%,var(--bg) 60%);
    color:var(--text); min-height:100vh; padding:16px;
  }
  .wrap{max-width:600px; margin:0 auto; display:flex; flex-direction:column; gap:14px}
  .hint{text-align:center; font-size:13px; color:var(--muted); background:var(--panel2); border:1px solid var(--border); border-radius:12px; padding:8px}
  .tablearea{display:grid; grid-template-columns:auto 1fr auto; gap:10px; align-items:stretch}
  .midcol{flex:1; display:flex; flex-direction:column; gap:10px; min-width:0}
  .sidehand{display:flex; flex-direction:column; align-items:center; justify-content:center; background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:12px 8px}
  .sidehand .card{max-width:42px; margin-top:-16px; box-shadow:0 3px 6px rgba(0,0,0,.45)}
  .sidehand .card:first-child{margin-top:0}
  .sidehand .card:nth-child(1){transform:rotate(-8deg)}
  .sidehand .card:nth-child(2){transform:rotate(0deg)}
  .sidehand .card:nth-child(3){transform:rotate(8deg)}
  .table{
    background:
      radial-gradient(ellipse at center, rgba(255,255,255,.07), transparent 65%),
      radial-gradient(120% 120% at 50% 28%, #2e7d4f 0%, #1e5c38 55%, #143d25 100%);
    border:1px solid #0f2e1d;
    border-radius:18px;
    padding:14px; display:flex; justify-content:center; gap:24px;
    align-items:center; aspect-ratio:1/1; width:min(100%,420px); margin:0 auto;
    box-shadow:
      inset 0 5px 14px rgba(0,0,0,.55),
      inset 0 -2px 5px rgba(255,255,255,.05),
      0 6px 16px rgba(0,0,0,.35);
  }
  .table.dupla{display:grid; grid-template-columns:1fr 1fr 1fr; grid-template-areas:". top ." "left center right" ". bottom ."; align-items:center; justify-items:center; gap:6px; width:min(100%,420px)}
  .table.dupla .playzone .card{width:58px}
  .table.dupla .vira .card{width:52px}
  #p1Play{grid-area:left} #p2Play{grid-area:top} #p3Play{grid-area:right} #humanPlay{grid-area:bottom} #viraBox{grid-area:center}
  .playzone{display:flex; flex-direction:column; align-items:center; gap:6px}
  .playzone .tag{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:1px}
  .card{
    width:100%; max-width:80px; aspect-ratio:2/3; border-radius:10px; position:relative; cursor:pointer;
    background:#fff; color:#1a1a1a; padding:5px; font-size:16px; font-weight:700;
    box-shadow:0 3px 8px rgba(0,0,0,.4); user-select:none; transition:transform .12s;
  }
  .card.red{color:var(--red)}
  .card.down{
    background:
      repeating-linear-gradient(45deg, rgba(255,255,255,.12) 0 1px, transparent 1px 7px),
      repeating-linear-gradient(-45deg, rgba(255,255,255,.12) 0 1px, transparent 1px 7px),
      radial-gradient(90% 90% at 50% 35%, rgba(255,255,255,.08), transparent 70%),
      linear-gradient(160deg,#2c5a8f 0%,#1c3d66 60%,#122a4a 100%);
    border:4px solid #f7f3e6;
    box-shadow:inset 0 0 0 4px #f7f3e6, inset 0 0 0 5px #1c3d66, 0 3px 8px rgba(0,0,0,.4);
    cursor:default;
  }
  .card.down::after{
    content:'◆'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:1em; color:rgba(255,255,255,.30); text-shadow:0 1px 2px rgba(0,0,0,.4);
  }
  .card.manilha{box-shadow:0 0 0 2px var(--gold), 0 3px 8px rgba(0,0,0,.4)}
  .card .corner{position:absolute; top:5px; left:6px; line-height:1}
  .card .corner.br{top:auto; bottom:5px; left:auto; right:6px; transform:rotate(180deg)}
  .pips{position:absolute; inset:0; display:grid; place-items:center; padding:18px 8px; font-size:13px; line-height:1; pointer-events:none}
  .pips .pip{display:block}
  .pips.p1{font-size:26px}
  .pips.p2{grid-template-rows:1fr 1fr}
  .pips.p3{grid-template-rows:1fr 1fr 1fr}
  .pips.p4{grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr}
  .pips.p5{grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr}
  .pips.p5 .pip:nth-child(5){position:absolute; inset:0; display:grid; place-items:center}
  .pips.p6{grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr 1fr}
  .pips.p7{grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr 1fr}
  .pips.p7 .pip:nth-child(7){position:absolute; inset:0; display:grid; place-items:center}
  .center{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:1.5em}
  .hand{display:flex; justify-content:center; gap:10px; background:var(--panel2); border:1px solid var(--border); border-radius:var(--radius); padding:16px; min-height:120px}
  .hand .card{max-width:70px}
  .cpuhand{display:flex; justify-content:center; gap:10px; padding:10px; min-height:80px; border:1px solid var(--border); border-radius:var(--radius); background:var(--panel); opacity:0.85}
  .cpuhand .card{max-width:62px; opacity:0.75}
  .vira{display:flex; flex-direction:column; align-items:center; gap:4px; background:rgba(10,20,14,.55); border:1px solid #1a3d29; border-radius:var(--radius); padding:10px}
  .vira .lbl{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:1px}
  @media (max-width:480px){
    .sidehand{padding:10px 5px}
    .sidehand .card{max-width:34px; margin-top:-12px}
    .table.dupla .playzone .card{width:52px}
    .table.dupla .vira .card{width:46px}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="hint">Preview estático do modo Dupla — redimensione a janela para ver telas estreitas (celular). Carta dourada = manilha. Slot tracejado = posição vazia.</div>

  <div class="tablearea">
    <div class="sidehand" id="p1Hand">
      <div class="card down"></div>
      <div class="card down"></div>
      <div class="card down"></div>
    </div>

    <div class="midcol">
      <div class="cpuhand" id="p2Hand">
        <div class="card down"></div>
        <div class="card down"></div>
        <div class="card down"></div>
      </div>

      <div class="table dupla" id="table">
        <div class="playzone" id="p2Play"><div class="tag">Parceiro</div>
          <div class="card"><span class="corner">7<span>♠</span></span><span class="corner br">7<span>♠</span></span><span class="pips p7"><span class="pip">♠</span><span class="pip">♠</span><span class="pip">♠</span><span class="pip">♠</span><span class="pip">♠</span><span class="pip">♠</span><span class="pip">♠</span></span></div>
        </div>
        <div class="playzone" id="p1Play"><div class="tag">Adv 1</div>
          <div class="card red"><span class="corner">A<span>♥</span></span><span class="corner br">A<span>♥</span></span><span class="pips p1"><span class="pip">♥</span></span></div>
        </div>
        <div class="playzone" id="p3Play"><div class="tag">Adv 2</div>
          <div class="card" style="background:transparent; border:2px dashed var(--border); box-shadow:none"></div>
        </div>
        <div class="playzone" id="humanPlay"><div class="tag">Você</div>
          <div class="card red manilha"><span class="corner">K<span>♦</span></span><span class="corner br">K<span>♦</span></span><span class="center">♦</span></div>
        </div>
        <div class="vira" id="viraBox"><div class="lbl">Vira</div>
          <div class="card"><span class="corner">3<span>♠</span></span><span class="corner br">3<span>♠</span></span><span class="pips p3"><span class="pip">♠</span><span class="pip">♠</span><span class="pip">♠</span></span></div>
        </div>
      </div>

      <div class="hand" id="hand">
        <div class="card"><span class="corner">4<span>♣</span></span><span class="corner br">4<span>♣</span></span><span class="pips p4"><span class="pip">♣</span><span class="pip">♣</span><span class="pip">♣</span><span class="pip">♣</span></span></div>
        <div class="card red"><span class="corner">5<span>♥</span></span><span class="corner br">5<span>♥</span></span><span class="pips p5"><span class="pip">♥</span><span class="pip">♥</span><span class="pip">♥</span><span class="pip">♥</span><span class="pip">♥</span></span></div>
        <div class="card"><span class="corner">Q<span>♣</span></span><span class="corner br">Q<span>♣</span></span><span class="center">♣</span></div>
      </div>
    </div>

    <div class="sidehand" id="p3Hand">
      <div class="card down"></div>
      <div class="card down"></div>
      <div class="card down"></div>
    </div>
  </div>
</div>
</body>
</html>
