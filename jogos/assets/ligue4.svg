<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Fundo Circular -->
  <circle cx="50" cy="50" r="48" fill="#3B82F6" />
  
  <!-- Contorno da Grade -->
  <rect x="20" y="20" width="60" height="60" rx="4" fill="none" stroke="#1E3A8A" stroke-width="4" />
  
  <!-- Linhas Horizontais da Grade -->
  <line x1="20" y1="40" x2="80" y2="40" stroke="#1E3A8A" stroke-width="2" />
  <line x1="20" y1="60" x2="80" y2="60" stroke="#1E3A8A" stroke-width="2" />
  
  <!-- Linhas Verticais da Grade -->
  <line x1="40" y1="20" x2="40" y2="80" stroke="#1E3A8A" stroke-width="2" />
  <line x1="60" y1="20" x2="60" y2="80" stroke="#1E3A8A" stroke-width="2" />
  
  <!-- Fichas Coloridas (Jogada) -->
  <circle cx="30" cy="70" r="6" fill="#EF4444" /> <!-- Vermelha -->
  <circle cx="50" cy="70" r="6" fill="#FBBF24" /> <!-- Amarela -->
  <circle cx="70" cy="70" r="6" fill="#EF4444" /> <!-- Vermelha -->
  <circle cx="50" cy="50" r="6" fill="#FBBF24" /> <!-- Amarela caindo -->
</svg>
