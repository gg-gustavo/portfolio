<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Fundo Circular -->
  <circle cx="50" cy="50" r="48" fill="#8B5CF6" />
  
  <!-- Corpo do Controle (Silhueta Moderna) -->
  <path d="M 35 35 
           H 65 
           C 75 35, 85 40, 85 55 
           C 85 65, 78 70, 74 70 
           C 70 70, 65 60, 60 58 
           H 40 
           C 35 60, 30 70, 26 70 
           C 22 70, 15 65, 15 55 
           C 15 40, 25 35, 35 35 Z" 
        fill="#F3F4F6" />
  
  <!-- D-Pad (Direcional) -->
  <rect x="26" y="44" width="6" height="18" rx="1" fill="#374151" />
  <rect x="20" y="50" width="18" height="6" rx="1" fill="#374151" />
  <!-- Detalhe côncavo no centro do D-Pad -->
  <circle cx="29" cy="53" r="1.5" fill="#1F2937" /> 

  <!-- Botões de Ação (Padrão de cores clássico) -->
  <circle cx="71" cy="46" r="3.5" fill="#EF4444" /> <!-- Topo (Vermelho) -->
  <circle cx="78" cy="53" r="3.5" fill="#10B981" /> <!-- Direita (Verde) -->
  <circle cx="71" cy="60" r="3.5" fill="#3B82F6" /> <!-- Baixo (Azul) -->
  <circle cx="64" cy="53" r="3.5" fill="#FBBF24" /> <!-- Esquerda (Amarelo) -->

  <!-- Botões Centrais (Select / Start) -->
  <rect x="42" y="52" width="5" height="2" rx="1" fill="#9CA3AF" />
  <rect x="53" y="52" width="5" height="2" rx="1" fill="#9CA3AF" />
</svg>
