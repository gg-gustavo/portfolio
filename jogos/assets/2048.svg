<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Fundo -->
  <circle cx="50" cy="50" r="48" fill="#F5A623" />
  <!-- Grade do tabuleiro -->
  <rect x="20" y="20" width="60" height="60" rx="6" fill="#BBADA0" />
  <!-- Blocos numerados (2, 4, 8, 16) -->
  <rect x="21" y="21" width="28" height="28" rx="4" fill="#EEE4DA" />
  <rect x="51" y="21" width="28" height="28" rx="4" fill="#EDE0C8" />
  <rect x="21" y="51" width="28" height="28" rx="4" fill="#F2B179" />
  <rect x="51" y="51" width="28" height="28" rx="4" fill="#F59563" />
  <!-- Números -->
  <g font-family="Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" dominant-baseline="central">
    <text x="35" y="35" fill="#776E65">2</text>
    <text x="65" y="35" fill="#776E65">4</text>
    <text x="35" y="65" fill="#FFFFFF">8</text>
    <text x="65" y="65" fill="#FFFFFF">16</text>
  </g>
</svg>
