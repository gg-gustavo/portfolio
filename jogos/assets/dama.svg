<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <circle cx="50" cy="50" r="48" fill="#DC2626" />
  <!-- Fundo do Tabuleiro -->
  <rect x="25" y="25" width="50" height="50" fill="#FDE047" rx="4" />
  <!-- Casas Escuras (Matriz 2x2 interna para simbolizar o padrão) -->
  <rect x="25" y="25" width="25" height="25" fill="#78350F" rx="4 0 0 0" />
  <rect x="50" y="50" width="25" height="25" fill="#78350F" rx="0 0 4 0" />
  <rect x="50" y="25" width="25" height="25" fill="#D97706" />
  <rect x="25" y="50" width="25" height="25" fill="#D97706" />
  <!-- Peças -->
  <circle cx="37.5" cy="37.5" r="8" fill="#1F2937" /> <!-- Peça Preta -->
  <circle cx="62.5" cy="62.5" r="8" fill="#F87171" /> <!-- Peça Vermelha -->
</svg>
