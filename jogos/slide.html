<!DOCTYPE html>
<html lang="pt-BR" data-accent="blue">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slide Puzzle</title>
<link rel="stylesheet" href="jogos.css">
<style>
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; }
  .stat .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-soft); font-weight: 600; }
  .stat .val { font-size: 24px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .board {
    display: grid; gap: 8px;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 8px; margin: 0 auto; width: 100%;
  }
  .tile {
    border-radius: 12px; display: flex; align-items: center; justify-content: center;
    font-size: clamp(22px, 7vw, 44px); font-weight: 800; color: #fff;
    cursor: pointer; user-select: none; transition: transform .12s ease, filter .12s ease;
    box-shadow: 0 4px 10px rgba(0, 0, 0, .35); text-shadow: 0 2px 4px rgba(0, 0, 0, .35);
    aspect-ratio: 1/1;
  }
  .tile:active { transform: scale(.94) }
  .tile.empty { background: transparent; box-shadow: none; cursor: default; text-shadow: none }
  .layoutgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0; }
  .layoutbtn {
    background: var(--surface); border: 2px solid var(--border); border-radius: 14px;
    padding: 16px 10px; cursor: pointer; transition: border-color .12s, transform .08s;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
  }
  .layoutbtn:hover { transform: scale(1.03) }
  .layoutbtn.selected { border-color: var(--acc); background: var(--acc-soft); }
  .layoutbtn .mini { display: grid; gap: 3px; width: 56px }
  .layoutbtn .mini div { background: var(--acc); border-radius: 2px; aspect-ratio: 1/1 }
  .layoutbtn .mini div.empty { background: transparent }
  .layoutbtn .name { font-weight: 600; font-size: 14px }
  .record { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; text-align: center }
  .record h3 { font-size: 13px; color: var(--text-soft); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px }
  .record .best { font-size: 18px; font-weight: 700 }
  .record .best small { color: var(--text-soft); font-weight: 400; font-size: 12px }
  .seedrow { display: flex; gap: 8px }
  .seedrow input {
    flex: 1; background: var(--surface); border: 1px solid var(--border); color: var(--text);
    border-radius: 12px; padding: 10px 12px; font-family: inherit; font-size: 14px; width: 100%;
  }
  .seedrow input:focus { outline: none; border-color: var(--acc) }
  .theme-btn-sm {
    display: inline-flex; align-items: center; justify-content: center;
    width: 38px; height: 38px; border-radius: 12px;
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    cursor: pointer; transition: border-color .15s, background .15s;
  }
  .theme-btn-sm:hover { border-color: var(--acc); background: var(--acc-soft); }
  @media (max-width: 420px) {
    .app { max-width: 340px }
    .stat .val { font-size: 20px }
  }
</style>
<script>document.documentElement.setAttribute("data-theme",(localStorage.getItem("theme")||"dark"));</script>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>Slide Puzzle</h1>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="theme-btn-sm" id="themeBtn" type="button" aria-label="Alternar tema"><svg id="themeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
      <a class="btn-back" href="index.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg> Voltar</a>
    </div>
  </header>

  <div class="stats">
    <div class="stat"><div class="lbl">Movimentos</div><div class="val" id="moves">0</div></div>
    <div class="stat"><div class="lbl">Tempo</div><div class="val" id="time">00:00</div></div>
  </div>

  <div class="board" id="board"></div>

  <div class="controls">
    <button class="ghost" id="btnNew">Novo Jogo</button>
    <button class="primary" id="btnShuffle">Embaralhar</button>
    <button class="ghost" id="btnMenu">Menu</button>
  </div>

  <div class="record">
    <h3>Melhor Recorde</h3>
    <div class="best" id="best">—</div>
  </div>
</div>

<div class="overlay hidden" id="menuOverlay">
  <div class="modal">
    <h2>Slide Puzzle</h2>
    <p class="sub">Escolha o layout e organize os blocos em ordem.</p>
    <div class="layoutgrid" id="layoutGrid"></div>
    <div class="seedrow"><input id="seed" type="text" placeholder="Seed (opcional)" autocomplete="off" spellcheck="false"></div>
    <button class="primary" id="btnStart" style="margin-top:12px">Iniciar Jogo</button>
  </div>
</div>

<div class="overlay hidden" id="winOverlay">
  <div class="modal">
    <h2><svg class="icon-trophy" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10v6a5 5 0 0 1-10 0z"/><path d="M7 6H4a2 2 0 0 0 2 4h1"/><path d="M17 6h3a2 2 0 0 1-2 4h-1"/></svg> Parabéns!</h2>
    <p class="sub">Quebra-cabeça resolvido</p>
    <div class="big" id="winTime">00:00</div>
    <div class="grid">
      <div class="cell"><div class="k">Movimentos</div><div class="v" id="winMoves">0</div></div>
      <div class="cell"><div class="k">Recorde</div><div class="v" id="winBest">—</div></div>
    </div>
    <button class="primary" id="btnPlayAgain">Jogar Novamente</button>
    <button class="ghost" id="btnMenu2">Menu</button>
  </div>
</div>

<script src="jogos.js"></script>
<script src="input.js"></script>
<script>
const COLORS = ['#4f8cff','#ff6b6b','#f5a623','#20c997','#a55eea','#ff7b54','#45b7d1','#e056fd',
                '#7bed9f','#ff9ff3','#70a1ff','#ffa502','#2ed573','#ff4757','#1e90ff'];

const LAYOUTS = [
  {name:'3x3', cols:3, rows:3},
  {name:'4x3', cols:4, rows:3},
  {name:'3x4', cols:3, rows:4},
  {name:'4x4', cols:4, rows:4},
];

const boardEl = document.getElementById('board');
const movesEl = document.getElementById('moves');
const timeEl = document.getElementById('time');
const seedInput = document.getElementById('seed');
const bestEl = document.getElementById('best');

let cols=3, rows=3, total=9;
let tiles=[], empty=0, moves=0, solved=false;
let timer=null, startTime=0, elapsed=0;
let curLayout=LAYOUTS[0];

function mulberry32(a){
  return function(){
    a|=0; a=a+0x6D2B79F5|0;
    let t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}

function isSolvable(arr,cols,rows){
  let inv=0;
  for(let i=0;i<arr.length;i++)
    for(let j=i+1;j<arr.length;j++)
      if(arr[i] && arr[j] && arr[i]>arr[j]) inv++;
  if(cols%2===1) return inv%2===0;
  const emptyRow = Math.floor(arr.indexOf(0)/cols);
  const blankFromBottom = rows - emptyRow;
  return (inv + blankFromBottom) % 2 === 1;
}

function shuffle(rand){
  const n = total-1;
  let arr=[...Array(n).keys()].map(i=>i+1);
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(rand()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  let guard=0;
  while(!isSolvable(arr.concat([0]),cols,rows) && guard++<1000){
    const a=Math.floor(rand()*n), b=Math.floor(rand()*n);
    [arr[a],arr[b]]=[arr[b],arr[a]];
  }
  arr.push(0);
  return arr;
}

function newGame(seed){
  const rand = seed ? mulberry32(seed) : Math.random;
  tiles = shuffle(rand);
  empty = total-1;
  moves = 0; solved = false;
  movesEl.textContent='0';
  render();
  stopTimer(); elapsed=0;
  timeEl.textContent=fmt(0);
}

function setLayout(l){
  curLayout=l; cols=l.cols; rows=l.rows; total=cols*rows;
  boardEl.style.gridTemplateColumns=`repeat(${cols},1fr)`;
  buildLayoutPicker();
}

function buildLayoutPicker(){
  const g=document.getElementById('layoutGrid');
  g.innerHTML='';
  LAYOUTS.forEach(l=>{
    const b=document.createElement('div');
    b.className='layoutbtn'+(l===curLayout?' selected':'');
    const mini=document.createElement('div');
    mini.className='mini';
    mini.style.gridTemplateColumns=`repeat(${l.cols},1fr)`;
    for(let i=0;i<l.cols*l.rows;i++){
      const c=document.createElement('div');
      if(i===l.cols*l.rows-1) c.className='empty';
      mini.appendChild(c);
    }
    const name=document.createElement('div');
    name.className='name';
    name.textContent=l.name;
    b.appendChild(mini); b.appendChild(name);
    b.addEventListener('click',()=>setLayout(l));
    g.appendChild(b);
  });
}

function render(){
  boardEl.innerHTML='';
  tiles.forEach((v,i)=>{
    const d=document.createElement('div');
    d.className='tile'+(v===0?' empty':'');
    d.textContent=v===0?'':v;
    if(v!==0) d.style.background=COLORS[v-1];
    d.addEventListener('click',()=>move(i));
    boardEl.appendChild(d);
  });
}

function move(i){
  if(solved) return;
  const [r,c]=[Math.floor(i/cols), i%cols];
  const [er,ec]=[Math.floor(empty/cols), empty%cols];
  if(Math.abs(r-er)+Math.abs(c-ec)!==1) return;
  [tiles[i],tiles[empty]]=[tiles[empty],tiles[i]];
  empty=i; moves++;
  movesEl.textContent=moves;
  if(!timer) startTimer();
  render();
  checkWin();
}

function moveDir(dir){
  const [er,ec]=[Math.floor(empty/cols), empty%cols];
  const target={
    'up':   (er+1<rows)? (er+1)*cols+ec : -1,
    'down': (er-1>=0)  ? (er-1)*cols+ec : -1,
    'left': (ec+1<cols)? er*cols+ec+1 : -1,
    'right':(ec-1>=0)  ? er*cols+ec-1 : -1,
  }[dir];
  if(target>=0) move(target);
}

boardEl.classList.add('game-surface');
let p0=null;
boardEl.addEventListener('pointerdown',e=>{
  if(e.button>0) return;
  p0={x:e.clientX,y:e.clientY};
});
boardEl.addEventListener('pointerup',e=>{
  if(!p0) return;
  const dir=swipeFrom(p0.x,p0.y,e.clientX,e.clientY,24);
  p0=null;
  if(dir){
    const sup=ev=>{ ev.preventDefault(); ev.stopPropagation(); document.removeEventListener('click',sup,true); };
    document.addEventListener('click',sup,true);
    setTimeout(()=>document.removeEventListener('click',sup,true),300);
    moveDir(dir);
  }
});
document.addEventListener('keydown',e=>{
  if(document.getElementById('menuOverlay').classList.contains('hidden')===false) return;
  if(e.key==='ArrowUp'){e.preventDefault();moveDir('up');}
  else if(e.key==='ArrowDown'){e.preventDefault();moveDir('down');}
  else if(e.key==='ArrowLeft'){e.preventDefault();moveDir('left');}
  else if(e.key==='ArrowRight'){e.preventDefault();moveDir('right');}
});

function checkWin(){
  const won=tiles.every((v,i)=> v===0 ? i===total-1 : v===i+1);
  if(won){ solved=true; stopTimer(); showWin(); }
}

function startTimer(){
  startTime=Date.now()-elapsed*1000;
  timer=setInterval(()=>{
    elapsed=Math.floor((Date.now()-startTime)/1000);
    timeEl.textContent=fmt(elapsed);
  },250);
}
function stopTimer(){ clearInterval(timer); timer=null; }
function fmt(s){
  const m=String(Math.floor(s/60)).padStart(2,'0');
  return m+':'+String(s%60).padStart(2,'0');
}

function key(){ return 'slidepuzzle_best_'+curLayout.name; }
function saveRecord(){
  const k=key();
  const prev=localStorage.getItem(k);
  if(!prev || elapsed<+prev) localStorage.setItem(k,String(elapsed));
  updateBest();
}
function updateBest(){
  const prev=localStorage.getItem(key());
  bestEl.textContent=prev?fmt(+prev):'—';
}
function showWin(){
  saveRecord();
  document.getElementById('winTime').textContent=fmt(elapsed);
  document.getElementById('winMoves').textContent=moves;
  document.getElementById('winBest').textContent=fmt(Math.min(elapsed,+localStorage.getItem(key())));
  document.getElementById('winOverlay').classList.remove('hidden');
}
function showMenu(){ buildLayoutPicker(); document.getElementById('menuOverlay').classList.remove('hidden'); }
function hideMenu(){ document.getElementById('menuOverlay').classList.add('hidden'); }
function hideWin(){ document.getElementById('winOverlay').classList.add('hidden'); }

document.getElementById('btnMenu').addEventListener('click',()=>location.href='index.html');
document.getElementById('btnMenu2').addEventListener('click',()=>location.href='index.html');
document.getElementById('btnNew').addEventListener('click',showMenu);
document.getElementById('btnStart').addEventListener('click',()=>{
  hideMenu();
  const v=seedInput.value.trim();
  const seed=v===''?undefined:(parseInt(v,10)||hash(v));
  newGame(seed);
});
document.getElementById('btnShuffle').addEventListener('click',()=>newGame());
document.getElementById('btnPlayAgain').addEventListener('click',()=>{hideWin();newGame();});
function hash(str){
  let h=2166136261;
  for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}
  return h>>>0;
}

setLayout(LAYOUTS[0]);
updateBest();
newGame();
showMenu();
</script>
</body>
</html>
